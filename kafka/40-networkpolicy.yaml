# Baseline default-deny ingress for the namespace. NetworkPolicies are additive:
# Strimzi auto-generates allow-policies for its own listener/replication/controller
# ports (STRIMZI_NETWORK_POLICY_GENERATION=true by default), so intra-cluster Kafka
# traffic keeps working. This policy just ensures nothing else is implicitly reachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kafka
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Allow Kafka clients from namespaces explicitly labelled kafka-client=true to reach
# the TLS listener (9093). Label consuming namespaces: kubectl label ns <ns> kafka-client=true
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clients-tls
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: fss-kafka
      strimzi.io/kind: Kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kafka-client: "true"
      ports:
        - protocol: TCP
          port: 9093
