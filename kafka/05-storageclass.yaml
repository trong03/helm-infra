# StorageClass cho Kafka trên Strimzi.
# GIỮ ĐÚNG 1 block theo nền tảng của bạn, XOÁ các block còn lại.
# Sau đó đổi `class: REPLACE-storageclass` trong 10-*.yaml và 11-*.yaml -> `kafka-ssd`.
#
# 3 field bắt buộc (đừng bỏ): volumeBindingMode / allowVolumeExpansion / reclaimPolicy.
# reclaimPolicy: Retain => xoá PVC KHÔNG xoá đĩa. An toàn cho fintech, nhưng phải
# dọn PV/đĩa mồ côi thủ công khi thực sự huỷ (nếu không sẽ tốn phí lưu trữ ngầm).

# ===================== AWS EKS =====================
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: kafka-ssd
# provisioner: ebs.csi.aws.com
# volumeBindingMode: WaitForFirstConsumer
# allowVolumeExpansion: true
# reclaimPolicy: Retain
# parameters:
#   type: gp3
#   iops: "3000"          # gp3 baseline; nâng nếu throughput cao
#   throughput: "125"     # MB/s baseline
#   encrypted: "true"
#   # kmsKeyId: <arn>     # bỏ comment nếu dùng CMK riêng (khuyến nghị fintech)

# ===================== GCP GKE =====================
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: kafka-ssd
# provisioner: pd.csi.storage.gke.io
# volumeBindingMode: WaitForFirstConsumer
# allowVolumeExpansion: true
# reclaimPolicy: Retain
# parameters:
#   type: pd-ssd
#   # disk-encryption-kms-key: <key>   # CMEK nếu cần

# ===================== Azure AKS =====================
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: kafka-ssd
# provisioner: disk.csi.azure.com
# volumeBindingMode: WaitForFirstConsumer
# allowVolumeExpansion: true
# reclaimPolicy: Retain
# parameters:
#   skuName: Premium_LRS       # hoặc PremiumV2_LRS cho IOPS/throughput cấu hình riêng

# ===================== On-prem: Longhorn =====================
# QUAN TRỌNG: numberOfReplicas="1". Kafka đã RF=3, để Longhorn=3 => 9x dung lượng
# + double-replication làm chậm ghi. SC riêng cho Kafka, KHÔNG dùng longhorn mặc định.
# Yêu cầu: open-iscsi trên mọi node. Benchmark throughput trước prod.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kafka-ssd
provisioner: driver.longhorn.io
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  numberOfReplicas: "1"          # Kafka lo durability; 1 để tránh replication kép
  dataLocality: best-effort      # giữ replica trên node của broker -> giảm network hop
  staleReplicaTimeout: "30"
  fsType: ext4
  # diskSelector / nodeSelector: "ssd"   # ghim vào disk/node SSD nếu cluster có nhãn

