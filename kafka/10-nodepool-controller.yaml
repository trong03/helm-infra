# Dedicated KRaft controllers (quorum metadata plane), isolated from brokers.
# 3 replicas => quorum tolerates loss of 1 controller with no metadata downtime.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: fss-kafka
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        # Controllers only store cluster metadata log; small but MUST be persistent.
        class: kafka-ssd                      # định nghĩa ở 05-storageclass.yaml (chọn block theo nền tảng)
        deleteClaim: false                    # never auto-delete metadata volumes
        kraftMetadata: shared
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  jvmOptions:
    -Xms: 1G
    -Xmx: 1G          # keep -Xmx == -Xms and <= ~50% of memory limit; leave headroom for page cache
  template:
    pod:
      # Spread the 3 controllers one-per-zone; do not let two land in the same AZ.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: fss-kafka
              strimzi.io/pool-name: controller
