# Dedicated brokers (data plane). 3 replicas across 3 zones.
# RF=3 + min.insync.replicas=2 (set on the Kafka CR) => survive loss of 1 broker
# with zero data loss and no producer downtime (acks=all).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: fss-kafka
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi                           # size for retention x throughput; PVCs can grow, never shrink
        class: kafka-ssd                      # định nghĩa ở 05-storageclass.yaml
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  jvmOptions:
    -Xms: 3G
    -Xmx: 3G          # <= ~50% of the 8Gi limit; the rest is OS page cache (critical for Kafka throughput)
  template:
    pod:
      # One broker per zone. DoNotSchedule keeps rack awareness honest under node pressure.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: fss-kafka
              strimzi.io/pool-name: broker
