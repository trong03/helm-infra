# mTLS client identity with least-privilege ACLs (deny-by-default via authorization: simple).
# The user operator creates a Secret "app-orders-producer" holding the client cert/key.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: app-orders-producer
  namespace: kafka
  labels:
    strimzi.io/cluster: fss-kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: orders-events
          patternType: literal
        operations: [Write, Describe]
        host: "*"
