# DEV override: single-zone, no TLS/auth, smaller footprint. NOT for prod.
# helm install fss-kafka ./fss-kafka -n kafka -f fss-kafka/values-dev.yaml
kafka:
  # Single zone -> disable rack awareness + topology spread (else pods Pending).
  rack: null
  # No ACLs in dev.
  authorization: null
  config:
    default.replication.factor: 3
    min.insync.replicas: 2
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2

# Plain internal listener (no TLS/mTLS) for quick local testing.
listeners:
  - name: plain
    port: 9093
    type: internal
    tls: false

# Alias Service để pod bất kỳ (mọi ns) nối gọn `fss-kafka:9093`.
# Strimzi đặt tên bootstrap là `fss-kafka-kafka-bootstrap`; alias này tạo thêm Service trần.
bootstrapAlias: fss-kafka

nodes:
  replicas: 3
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits:   { cpu: 500m, memory: 1536Mi }
  jvm:
    heap: 768M

networkPolicy:
  enabled: false

# Tắt test listener 9092 — dev đã có plain/9093 riêng; để bật sẽ TRÙNG TÊN `plain` -> invalid.
testListener:
  enabled: false

users: []
