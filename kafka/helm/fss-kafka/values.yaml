# ============================================================================
# fss-kafka — DUAL-ROLE KRaft (controller + broker trong cùng node). Hợp cluster nhỏ.
# Strimzi operator PHẢI cài sẵn (xem ../values-operator.yaml + helm/README.md).
# ============================================================================

cluster:
  name: fss-kafka

kafka:
  version: "4.3.0"
  # Trống cho cụm mới (Strimzi tự set khớp version). Chỉ set khi nâng metadata có kiểm soát.
  metadataVersion: ""

  # HA / durability core (chỉ có tác dụng khi producer acks=all).
  config:
    default.replication.factor: 3
    min.insync.replicas: 2
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    unclean.leader.election.enable: false
    auto.create.topics.enable: false

  # On-prem không có label zone -> dùng hostname (mọi node có). Trải theo NODE, HA khi mất 1 node.
  # Cluster có zone thật thì đổi về topology.kubernetes.io/zone. topologySpread của pod cũng dùng key này.
  rack:
    topologyKey: kubernetes.io/hostname

  authorization:
    type: simple

  pdb:
    maxUnavailable: 1

listeners:
  # Internal (trong cluster) — app chạy trong K8s dùng listener này. GIỮ NGUYÊN.
  - name: tls
    port: 9093
    type: internal
    tls: true
    authentication:
      type: tls

  # TEST-ONLY: plaintext internal (KHÔNG TLS, KHÔNG auth) để test nhanh trong
  # cluster mà không cần cert. CHỈ dùng dev/test — GỠ trước khi lên prod (fintech).
  # Bật/tắt qua .Values.testListener.enabled (mặc định false). Chỉ reachable trong cluster.

  # External (ngoài cluster) qua LoadBalancer (MetalLB / cloud LB).
  # Strimzi tạo 4 Service LoadBalancer: 1 bootstrap + 3 per-broker (mỗi broker 1 IP
  # riêng — bắt buộc, client phải nối thẳng tới broker giữ leader).
  # GIỮ TLS + mTLS: fintech không plaintext; ACL deny-by-default vẫn áp.
  # IP cố định lấy từ externalListener.* bên dưới (do template kafka.yaml chèn vào).
  - name: external
    port: 9094
    type: loadbalancer
    tls: true
    authentication:
      type: tls

  # External qua NodePort — dùng khi KHÔNG có LoadBalancer provider (chưa có MetalLB/cloud LB).
  # Strimzi mở 1 NodePort bootstrap + 1 NodePort mỗi broker trên MỌI node (dải 30000-32767),
  # client ngoài nối tới <IP-node>:<nodePort>. GIỮ TLS + mTLS (fintech: không plaintext ra ngoài).
  # NetworkPolicy phải mở cho dải client -> đặt networkPolicy.externalNodePortCIDRs bên dưới.
  - name: extnp
    port: 9095
    type: nodeport
    tls: true
    authentication:
      type: tls
    # configuration:
    #   # Giữ IP client thật (ipBlock NetworkPolicy khớp chính xác). Chỉ node có broker pod mới
    #   # trả lời — 2-3 node đều có broker thì OK. Bỏ dòng này = Cluster (SNAT thành IP node).
    #   externalTrafficPolicy: Local
    #   bootstrap:
    #     nodePort: 32100                 # pin nodePort (mặc định Strimzi tự cấp)
    #   brokers:
    #     # advertisedHost: IP/hostname client dùng để nối, nếu InternalIP node không reachable
    #     # từ ngoài (VD client nối qua floating/public IP). Đúng thứ tự broker 0,1,2.
    #     - broker: 0
    #       advertisedHost: "10.0.0.11"
    #       nodePort: 32000
    #     - broker: 1
    #       advertisedHost: "10.0.0.12"
    #       nodePort: 32001
    #     - broker: 2
    #       advertisedHost: "10.0.0.13"
    #       nodePort: 32002

# IP cố định cho external listener (nằm TRONG dải IPAddressPool của MetalLB).
# Bỏ trống (enabled: false hoặc IP rỗng) -> MetalLB tự cấp IP động.
# Điền IP thật để cố định, dễ whitelist firewall + trỏ DNS.
externalListener:
  enabled: false           # BẬT lại (true) khi đã có IP pool MetalLB, nếu không Service LB kẹt <pending>
  bootstrapIP: ""          # ví dụ 10.x.x.240
  brokerIPs: []            # ví dụ ["10.x.x.241","10.x.x.242","10.x.x.243"] — đúng thứ tự broker 0,1,2

# TEST-ONLY listener plaintext 9092 (internal, không TLS/auth). Bật để test nhanh
# trong cluster, TẮT (false) trước khi lên prod. Chỉ reachable trong cluster.
testListener:
  enabled: true

# Dual-role: mỗi node vừa controller vừa broker. replicas=3 -> 3 pod, 1/node.
# Sizing hạ cho cluster 3-node kiêm control-plane. Prod thật cần worker riêng, RAM/disk lớn hơn.
nodes:
  replicas: 3
  storage:
    size: 10Gi          # < disk trống Longhorn mỗi node (numberOfReplicas=1)
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: "1",  memory: 2Gi }
  jvm:
    heap: 1G            # <= ~50% memory limit

storage:
  className: kafka-ssd
  create: true          # chart tự tạo SC Longhorn. Nếu SC đã tồn tại: kubectl delete sc kafka-ssd trước.
  provisioner: driver.longhorn.io
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Retain
  parameters:
    numberOfReplicas: "1"     # Kafka RF=3 lo durability; tránh replication kép
    dataLocality: best-effort
    fsType: ext4

# Cho phép pod Kafka chạy trên node control-plane (cluster 3-node, 2 node là control-plane).
# Có worker riêng đủ 3+ node thì đặt tolerations: [] để KHÔNG chạy trên control-plane.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

entityOperator:
  enabled: true

networkPolicy:
  enabled: true
  clientNamespaceLabel: kafka-client
  clientNamespaceValue: "true"
  # Dải CIDR được phép nối tới listener NodePort external từ NGOÀI cluster.
  # Traffic NodePort vào pod: externalTrafficPolicy=Cluster (mặc định) SNAT nguồn thành IP node
  #   -> cần cho phép dải NODE/POD network. Đặt externalTrafficPolicy=Local (trong listener extnp)
  #   giữ IP client thật -> để đúng dải client subnet ở đây.
  # KHÔNG để 0.0.0.0/0 ở prod. Rỗng = không mở -> NodePort bị default-deny chặn.
  externalNodePortCIDRs: []   # ví dụ ["10.0.0.0/24"]

topics:
  - name: orders-events
    partitions: 6
    replicas: 3
    config:
      min.insync.replicas: "2"
      retention.ms: "604800000"
      cleanup.policy: delete

users:
  - name: app-orders-producer
    authentication: { type: tls }
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: orders-events, patternType: literal }
          operations: [Write, Describe]
          host: "*"
