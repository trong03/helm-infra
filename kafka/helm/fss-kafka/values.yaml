# ============================================================================
# fss-kafka — DUAL-ROLE KRaft (controller + broker trong cùng node). Hợp cluster nhỏ.
# Strimzi operator PHẢI cài sẵn (xem ../values-operator.yaml + helm/README.md).
# ============================================================================

cluster:
  name: fss-kafka

kafka:
  version: "4.3.0"
  # Trống cho cụm mới (Strimzi tự set khớp version). Chỉ set khi nâng metadata có kiểm soát.
  metadataVersion: ""

  # HA / durability core (chỉ có tác dụng khi producer acks=all).
  config:
    default.replication.factor: 3
    min.insync.replicas: 2
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    unclean.leader.election.enable: false
    auto.create.topics.enable: false

  # On-prem không có label zone -> dùng hostname (mọi node có). Trải theo NODE, HA khi mất 1 node.
  # Cluster có zone thật thì đổi về topology.kubernetes.io/zone. topologySpread của pod cũng dùng key này.
  rack:
    topologyKey: kubernetes.io/hostname

  authorization:
    type: simple

  pdb:
    maxUnavailable: 1

listeners:
  - name: tls
    port: 9093
    type: internal
    tls: true
    authentication:
      type: tls

# Dual-role: mỗi node vừa controller vừa broker. replicas=3 -> 3 pod, 1/node.
# Sizing hạ cho cluster 3-node kiêm control-plane. Prod thật cần worker riêng, RAM/disk lớn hơn.
nodes:
  replicas: 3
  storage:
    size: 10Gi          # < disk trống Longhorn mỗi node (numberOfReplicas=1)
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: "1",  memory: 2Gi }
  jvm:
    heap: 1G            # <= ~50% memory limit

storage:
  className: kafka-ssd
  create: true          # chart tự tạo SC Longhorn. Nếu SC đã tồn tại: kubectl delete sc kafka-ssd trước.
  provisioner: driver.longhorn.io
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Retain
  parameters:
    numberOfReplicas: "1"     # Kafka RF=3 lo durability; tránh replication kép
    dataLocality: best-effort
    fsType: ext4

# Cho phép pod Kafka chạy trên node control-plane (cluster 3-node, 2 node là control-plane).
# Có worker riêng đủ 3+ node thì đặt tolerations: [] để KHÔNG chạy trên control-plane.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

entityOperator:
  enabled: true

networkPolicy:
  enabled: true
  clientNamespaceLabel: kafka-client
  clientNamespaceValue: "true"

topics:
  - name: orders-events
    partitions: 6
    replicas: 3
    config:
      min.insync.replicas: "2"
      retention.ms: "604800000"
      cleanup.policy: delete

users:
  - name: app-orders-producer
    authentication: { type: tls }
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: orders-events, patternType: literal }
          operations: [Write, Describe]
          host: "*"
