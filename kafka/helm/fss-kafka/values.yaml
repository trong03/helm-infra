# ============================================================================
# fss-kafka — DEFAULTS = production HA. Override per environment with -f values-<env>.yaml
# The Strimzi operator MUST already be installed in the target namespace.
# ============================================================================

cluster:
  # Kafka CR name; also the strimzi.io/cluster label all resources join.
  name: fss-kafka

kafka:
  version: "4.3.0"
  # Leave empty for a fresh cluster (Strimzi defaults it to match version).
  # Set explicitly (e.g. "4.3-IV0") only for a controlled metadata upgrade.
  metadataVersion: ""

  # HA / durability core. This is what guarantees "no data loss on 1 broker down"
  # (only in combination with producer acks=all — enforce that client-side).
  config:
    default.replication.factor: 3
    min.insync.replicas: 2
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    unclean.leader.election.enable: false
    auto.create.topics.enable: false

  # Rack awareness: spread partition replicas across failure domains. Set rack: null to disable.
  # On-prem KHÔNG có label zone -> dùng kubernetes.io/hostname (mọi node đều có) => trải theo
  # NODE, HA khi mất 1 node. Nếu cluster CÓ label topology.kubernetes.io/zone thật thì đổi lại
  # về zone để chống mất cả AZ. topologySpread của pod cũng dùng chính key này.
  rack:
    topologyKey: kubernetes.io/hostname

  # Deny-by-default ACLs. Set authorization: null to disable (dev only).
  authorization:
    type: simple

  pdb:
    maxUnavailable: 1

# Listeners passed verbatim to spec.kafka.listeners. Default: internal TLS + mTLS.
# For dev, override to a plain internal listener (see values-dev.yaml).
listeners:
  - name: tls
    port: 9093
    type: internal
    tls: true
    authentication:
      type: tls

controller:
  replicas: 3
  storage:
    size: 20Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "1",  memory: 2Gi }
  jvm:
    heap: 1G          # -Xms == -Xmx; keep <= ~50% of memory limit

broker:
  replicas: 3
  storage:
    size: 100Gi
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits:   { cpu: "2", memory: 8Gi }
  jvm:
    heap: 3G          # <= ~50% of 8Gi limit; rest is OS page cache

storage:
  # Name of the StorageClass the volumes use. REQUIRED.
  className: kafka-ssd
  # Chart tự tạo StorageClass "kafka-ssd" (cluster-scoped). All-Helm: để true.
  # LƯU Ý: nếu kafka-ssd đã tồn tại (tạo tay trước đó), Helm sẽ báo "invalid ownership
  # metadata" -> xoá SC cũ trước: kubectl delete sc kafka-ssd (KHÔNG ảnh hưởng PV/PVC đã có).
  create: true
  provisioner: driver.longhorn.io
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Retain
  parameters:
    numberOfReplicas: "1"       # Kafka RF=3 already; avoid double-replication
    dataLocality: best-effort
    fsType: ext4

# Tolerations cho pod broker + controller. Cluster 3-node của FSS có 2 node control-plane
# bị taint NoSchedule; tolerate nó để Kafka trải đủ 3 node (HA mức node) mà KHÔNG phải gỡ
# taint toàn cục. Nếu cluster có worker riêng đủ 3+ node, đặt tolerations: [] để KHÔNG chạy
# trên control-plane.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

entityOperator:
  enabled: true

networkPolicy:
  enabled: true
  # Namespaces labelled with this key=value may reach the TLS listener.
  clientNamespaceLabel: kafka-client
  clientNamespaceValue: "true"

# Declaratively managed topics. Each becomes a KafkaTopic CR.
topics:
  - name: orders-events
    partitions: 6
    replicas: 3
    config:
      min.insync.replicas: "2"
      retention.ms: "604800000"
      cleanup.policy: delete

# Declaratively managed users (mTLS + least-privilege ACLs).
users:
  - name: app-orders-producer
    authentication: { type: tls }
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: orders-events, patternType: literal }
          operations: [Write, Describe]
          host: "*"
