apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: {{ include "fss-kafka.name" . }}
    {{- include "fss-kafka.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.controller.storage.size | quote }}
        class: {{ required "storage.className is required" .Values.storage.className }}
        deleteClaim: false
        kraftMetadata: shared
  resources:
    {{- toYaml .Values.controller.resources | nindent 4 }}
  jvmOptions:
    -Xms: {{ .Values.controller.jvm.heap | quote }}
    -Xmx: {{ .Values.controller.jvm.heap | quote }}
  {{- if or .Values.tolerations .Values.kafka.rack }}
  template:
    pod:
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafka.rack }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ include "fss-kafka.name" $ }}
              strimzi.io/pool-name: controller
      {{- end }}
  {{- end }}
