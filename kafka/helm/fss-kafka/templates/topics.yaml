{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .name }}
  labels:
    strimzi.io/cluster: {{ include "fss-kafka.name" $ }}
    {{- include "fss-kafka.labels" $ | nindent 4 }}
spec:
  partitions: {{ required "topic.partitions is required" .partitions }}
  replicas: {{ required "topic.replicas is required" .replicas }}
  {{- with .config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
