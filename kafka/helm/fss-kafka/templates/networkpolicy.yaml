{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fss-kafka.name" . }}-default-deny-ingress
  labels:
    {{- include "fss-kafka.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fss-kafka.name" . }}-allow-clients-tls
  labels:
    {{- include "fss-kafka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: {{ include "fss-kafka.name" . }}
      strimzi.io/kind: Kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: {{ .Values.networkPolicy.clientNamespaceValue | quote }}
      ports:
        {{- range .Values.listeners }}
        - protocol: TCP
          port: {{ .port }}
        {{- end }}
{{- with .Values.networkPolicy.externalNodePortCIDRs }}
---
# Cho phép client NGOÀI cluster nối tới listener NodePort (extnp) từ dải CIDR tin cậy.
# NodePort không đi qua namespaceSelector được -> phải dùng ipBlock. mTLS + ACL vẫn áp ở tầng Kafka.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fss-kafka.name" $ }}-allow-external-nodeport
  labels:
    {{- include "fss-kafka.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: {{ include "fss-kafka.name" $ }}
      strimzi.io/kind: Kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $.Values.listeners }}
        {{- if eq .type "nodeport" }}
        - protocol: TCP
          port: {{ .port }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
