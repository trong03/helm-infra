{{- if .Values.pdb.enabled }}
# Operator KHÔNG tự tạo PDB. Selector dùng LABEL DO CHART GẮN (fss.io/component) -> không drift.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fss-clickhouse.name" . }}-server
  labels:
    {{- include "fss-clickhouse.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      fss.io/component: clickhouse-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fss-clickhouse.keeperName" . }}-keeper
  labels:
    {{- include "fss-clickhouse.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      fss.io/component: clickhouse-keeper
{{- end }}
